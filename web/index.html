<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF" />
  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />

  <meta name="description"
    content="Build Stunning flutter UI and UX from a vast collection of templates, blocs, animations and effects!" />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Flutter Widget Hub" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Prevent caching of files -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="icon" type="image/png" href="icons/favicon.ico" />

  <title>Flutter WidgetHub</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#1a5ca8" />
  <meta name="msapplication-TileColor" content="#1a5ca8" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c151f" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles/loader.css" />

  <!-- <script src="flutter.js" defer></script> -->
  <!-- <script src="flutter_build_config.js" defer type="js"></script> -->
  <!-- <script src="flutter_web_plugins.js" defer></script> -->
</head>

<body>
  <div id="preloader">
    <div class="container">
      <div class="logos">
        <img src="./images/flutterwidgethub_Logo.png" alt="Flutter WidgetHub" class="lightLogo" />
        <img src="./images/flutterwidgethub_Logo_white.png" alt="Flutter WidgetHub" class="darkLogo" />
      </div>

      <p class="animated-text" role="status" aria-live="polite"></p>

      <div class="progress" role="progressbar" aria-label="Loading Flutter WidgetHub"></div>
    </div>

    <div id="btn_container">
      <button id="skip_btn" type="button">Skip</button>
      <button id="always_skip_btn" type="button">Always skip</button>
    </div>

    <p class="footer">Built with 💙 for the Flutter community</p>
  </div>

  <script src="loader.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
